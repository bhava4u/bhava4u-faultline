name: Maritime data

# Refreshes live ship positions, sanctions matches and chokepoint traffic
# for faultlinerisk.com/maritime/ and publishes them to the maritime-data
# branch (no history is kept there, so the repo stays small).

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: maritime-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Restore previous data
        run: |
          mkdir -p out
          if git fetch --depth=1 origin maritime-data 2>/dev/null; then
            git archive FETCH_HEAD | tar -x -C out
            echo "Restored previous maritime data."
          else
            echo "First run: no previous data."
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install "websockets>=12,<14"

      - name: Update maritime data
        env:
          AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}
          AIS_SECONDS: "180"
        run: python scripts/maritime_update.py --out out --config data/maritime.json

      - name: Publish to maritime-data branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out
          git init -q -b maritime-data
          git config user.name "faultline-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Maritime data $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" maritime-data
