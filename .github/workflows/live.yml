name: Live headlines

on:
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live-headlines
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch headlines
        run: python scripts/live.py
      - name: Publish
        run: |
          git config user.name "faultline-bot"
          git config user.email "faultline-bot@users.noreply.github.com"
          git add data/live.json
          git commit -m "Live headlines $(date -u +%F' '%H:%M)" || exit 0
          git pull --rebase -q origin main
          git push
